name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'numpy<2'
      - run: pip install -e '.[dev]'
      - if: matrix.python-version == '3.10'
        run: pip install 'transformers==4.43.3' 'numpy<2'
      - run: ruff check src scripts tests
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - if: matrix.python-version == '3.10'
        run: |
          python scripts/train.py --config configs/default.yaml --epochs 1 --output outputs/toy.pt
          python scripts/evaluate.py --config configs/default.yaml --checkpoint outputs/toy.pt --output outputs/toy_eval
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
