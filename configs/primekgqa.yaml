seed: 42
device: cuda
data:
  entities: data/primekg/entities.jsonl
  edges: data/primekg/edges.jsonl
  questions: data/primekgqa/test.jsonl
  add_inverse_edges: true
  kind: benchmark
  train: data/primekgqa/train.jsonl
  dev: data/primekgqa/dev.jsonl
  test: data/primekgqa/test.jsonl
encoder:
  backend: huggingface
  model_name: meta-llama/Llama-3.1-8B-Instruct
  hidden_dim: 4096
  max_length: 384
  torch_dtype: bfloat16
  freeze: false
  trust_remote_code: false
  gradient_checkpointing: true
schema:
  max_hops: 3
  top_m: 4
  beam_size: 32
search:
  top_n_anchors: 8
  beam_width: 32
  max_hops: 3
  max_expansions: 20000
  max_paths_per_candidate: 8
  lambda_ground: 1.0
  lambda_schema: 2.0
  lambda_semantic: 0.5
  lambda_hub: 0.15
  relation_mismatch: 1.0
  direction_mismatch: 0.75
  type_mismatch: 0.5
  length_mismatch: 0.5
model:
  hidden_dim: 4096
  type_dim: 128
  relation_dim: 256
  topology_dim: 64
  attention_layers: 2
  relation_bases: 8
  relation_rank: 16
  prior_strength: 1.0
  path_score_weight: 0.35
  answer_threshold: 0.43
  dropout: 0.1
training:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  epochs: 5
  pointwise_weight: 1.0
  pairwise_weight: 0.5
  listwise_weight: 0.5
  path_weight: 0.25
  calibration_weight: 0.1
  pairwise_margin: 0.2
  schema_weight: 1.0
  grounding_weight: 1.0
  batch_size: 8
output:
  open_answer: canonical
