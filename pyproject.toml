[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resemreason"
version = "0.1.0"
description = "Relation-semantic reasoning for biomedical multi-hop question answering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ReSemReason Contributors"}]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
hf = [
  "transformers>=4.43",
  "accelerate>=0.33",
  "sentencepiece>=0.2"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10"
]

[project.scripts]
resemreason-infer = "resemreason.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
